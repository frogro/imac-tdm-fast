# Static splash, no menu or artificial wait.
search --no-floppy --label TDMFAST --set=root
set gfxmode=2560x1440,1920x1080,auto
set gfxpayload=keep
if loadfont (memdisk)/boot/grub/fonts/ascii.pf2; then
    if terminal_output gfxterm; then
        background_color black
        background_image /boot/splash.png
    fi
fi
# Keep Linux text away from the display; diagnostic output goes to serial only.
if test -f /diagnostics.txt; then
    terminal_output console
    linux /boot/vmlinuz rdinit=/init console=tty0 loglevel=3 tdm.diagnostics=1
else
    linux /boot/vmlinuz quiet loglevel=0 rdinit=/init console=ttyS0,115200 logo.nologo vt.global_cursor_default=0 fbcon=map:1
fi
initrd /boot/fast.gz
boot
# Reached only if loading/booting failed.
echo "TDM-Start fehlgeschlagen. USB-Stick pruefen."
sleep --interruptible 30
